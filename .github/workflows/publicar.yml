# Publica a Fila DTF na Cloudflare Pages (projeto fila-dtf, separado do hub) a cada envio para main,
# depois dos testes e da checagem de isolamento. Confere que ficou no ar e que o link de pedido não
# baixa sem PIN. Só então troca o endereço antigo do GitHub Pages por um redirecionamento.
# Precisa de dois segredos do repositório (nunca no código): CLOUDFLARE_API_TOKEN (só Pages) e
# CLOUDFLARE_ACCOUNT_ID. Os segredos da Fila (PIN_ADMIN, SEGREDO_LINK) ficam no projeto da Cloudflare.
name: Publicar Fila DTF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

env:
  PROJETO: fila-dtf
  ENDERECO: https://fila-dtf.pages.dev

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Isolamento (nada aponta para sistemas internos)
        run: node checar-isolamento.js
      - name: Encaixe
        run: node testes/teste-encaixe.js
      - name: PNG
        run: node testes/teste-png.js
      - name: 80 filas sorteadas (nada sobreposto, nada fora do filme)
        run: node testes/medir-encaixe.js --n 80 --ms 300

  cloudflare:
    needs: testar
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir segredos
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Faltam os segredos CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID no repositório. Nada foi publicado."
            exit 1
          fi
      - name: Instalar o Wrangler (versão travada em ferramentas/package-lock.json)
        run: |
          npm ci --prefix ferramentas --no-audit --no-fund >/dev/null
          echo "$GITHUB_WORKSPACE/ferramentas/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Versão nos arquivos (o navegador busca o código novo em vez de usar o guardado)
        run: |
          v=${GITHUB_SHA::7}
          sed -i "s/?v=dev/?v=$v/g" site/index.html
          grep -c "?v=$v" site/index.html
      - name: Publicar na Cloudflare Pages
        run: wrangler pages deploy site --project-name "$PROJETO" --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --pretty=%s | head -c 90)"
      - name: Conferir no ar (página, servidor e link de pedido fechado sem PIN)
        run: |
          sleep 15
          v=${GITHUB_SHA::7}
          for i in 1 2 3 4 5 6; do
            curl -s "$ENDERECO/?x=$RANDOM" | grep -q "montador.js?v=$v" && break
            sleep 10
          done
          curl -s "$ENDERECO/?x=$RANDOM" | grep -q "montador.js?v=$v" || { echo "A versão nova não apareceu no ar."; exit 1; }
          curl -s "$ENDERECO/api/admin" | grep -q '"admin":false' || { echo "O servidor (/api/admin) não respondeu."; exit 1; }
          s=$(curl -s -o /dev/null -w "%{http_code}" "$ENDERECO/api/pedido/AAAAAA")
          [ "$s" = "303" ] || { echo "Link de pedido sem PIN respondeu $s (esperado 303 para a tela do PIN)."; exit 1; }
          echo "No ar e fechado: página $v, servidor ok, pedido sem PIN vai para a tela do PIN."

  # O endereço antigo (GitHub Pages) vira só um redirecionamento para o novo, para ninguém continuar
  # usando uma versão que deixava baixar o PNG.
  redirecionar:
    needs: cloudflare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirecionar
      - id: deploy
        uses: actions/deploy-pages@v4
