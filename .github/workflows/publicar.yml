# Publica a pasta site/ no GitHub Pages a cada envio para main, depois dos testes e da checagem de isolamento.
name: Publicar Fila DTF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Isolamento (nada aponta para sistemas internos)
        run: node checar-isolamento.js
      - name: Encaixe
        run: node testes/teste-encaixe.js
      - name: PNG
        run: node testes/teste-png.js

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
