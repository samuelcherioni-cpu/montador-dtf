# Projeto da Fila DTF na Cloudflare Pages (separado do hub: outro projeto, outros segredos).
name = "fila-dtf"
pages_build_output_dir = "site"
compatibility_date = "2026-10-19"

# Os pedidos (PNG dos clientes) ficam no Google Drive da Zavari, pasta "Pedidos Fila DTF" (ver functions/_drive.js).

# Segredos (cadastrados no painel da Cloudflare, nunca aqui):
#   PIN_ADMIN    — PIN de 4 dígitos do administrador
#   SEGREDO_LINK — texto longo aleatório que assina a sessão de admin (o robô cria sozinho)
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN — acesso só à pasta de pedidos no Drive
